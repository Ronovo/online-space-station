{% import "game/_ui.html" as ui %}
{{ ui.panel_header(p.title) }}
<p class="center">{{ p.intro }}</p>
<p class="center">Your credits: {{ p.credits }}</p>
<div class="card-list" data-scroll-key="stand-goods">
  {% for item in p.goods %}
  <div class="item-card botany">
    <span class="item-name">{{ item.name }} - {{ item.price }} credits</span>
    {{ ui.btn("Buy", "panel.buy", {"item_id": item.id}, "btn-small") }}
  </div>
  {% endfor %}
</div>
